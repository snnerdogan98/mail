<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notlar</title>
<meta name="theme-color" content="#26282c">
<link rel="manifest" href="notlar.webmanifest?v=1">
<link rel="icon" href="notlar-192.png?v=1">
<link rel="apple-touch-icon" href="notlar-apple.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notlar">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cam.css" id="css-cam">
<link rel="stylesheet" href="koyu.css" id="css-koyu" media="not all">
<script>
function applyTheme(t) {
  var cam = document.getElementById('css-cam'), koyu = document.getElementById('css-koyu');
  cam.media = t === 'flat' ? 'not all' : 'all';
  koyu.media = t === 'dark' ? 'all' : t === 'auto' ? '(prefers-color-scheme: dark)' : 'not all';
  document.documentElement.dataset.theme = t;
}
try { applyTheme(JSON.parse(localStorage.getItem('theme')) || 'light'); } catch (e) { applyTheme('light'); }
</script>
</head>
<body class="notes-app">
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script src="mock.js"></script>
<script src="app.js"></script>
<script src="autocorrect.js"></script>
<script src="access.js"></script>
<script src="feedback.js"></script>
<script src="about.js"></script>
<script src="notes-app.js"></script>
</body>
</html>
