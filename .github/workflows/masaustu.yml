name: Windows programı
on:
  push:
    branches: [desktop]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  derle:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Mail-Kurulum
          path: desktop/dist/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: masaustu-${{ github.run_number }}
          name: Mail Windows programı (${{ github.run_number }})
          body: Mail-Kurulum dosyasını indirip çalıştır. Uyarı çıkarsa Ek bilgi → Yine de çalıştır.
          files: desktop/dist/*.exe
